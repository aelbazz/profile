<div class="page-hero">
  <div class="container text-center">
    <h1>Contact {{ platformName }}</h1>
    <p class="lead">Have a question, or ready to get started? Send us a message.</p>
  </div>
</div>

<div class="container section">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      @if (submitted()) {
        <div class="success-panel" role="status">
          <i class="fas fa-circle-check"></i>
          <h2 class="h4">Message sent</h2>
          <p class="text-muted mb-0">Thanks for reaching out - we'll get back to you soon.</p>
        </div>
      } @else {
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          @if (errorMessage()) {
            <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
          }

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="contact-name">Name *</label>
              <input id="contact-name" type="text" class="form-control" formControlName="name"
                     [class.is-invalid]="form.controls.name.invalid && form.controls.name.touched" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="contact-email">Email *</label>
              <input id="contact-email" type="email" class="form-control" formControlName="email"
                     [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="contact-phone">Phone</label>
              <input id="contact-phone" type="tel" class="form-control" formControlName="phone" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="contact-company">Company</label>
              <input id="contact-company" type="text" class="form-control" formControlName="company" />
            </div>
            <div class="col-12">
              <label class="form-label" for="contact-subject">Subject *</label>
              <input id="contact-subject" type="text" class="form-control" formControlName="subject"
                     [class.is-invalid]="form.controls.subject.invalid && form.controls.subject.touched" />
            </div>
            <div class="col-12">
              <label class="form-label" for="contact-message">Message *</label>
              <textarea id="contact-message" class="form-control" rows="5" formControlName="message"
                        [class.is-invalid]="form.controls.message.invalid && form.controls.message.touched"></textarea>
            </div>

            <!-- Honeypot: invisible to a sighted user and skipped by screen readers and tab
                 order, but present in the DOM for a bot that fills every field to catch. -->
            <div class="honeypot-field" aria-hidden="true">
              <label for="contact-website">Website</label>
              <input id="contact-website" type="text" tabindex="-1" autocomplete="off" formControlName="website" />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg mt-4" [disabled]="submitting()">
            @if (submitting()) {
              <span class="spinner-border spinner-border-sm me-2"></span>Sending...
            } @else {
              Send Message
            }
          </button>
        </form>
      }
    </div>
  </div>
</div>
