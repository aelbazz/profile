@if (hasError()) {
  <div class="data-state data-state--error" role="alert">
    <div class="data-state-icon">
      <i class="fas fa-triangle-exclamation"></i>
    </div>
    <h4 class="data-state-title">Couldn't load {{ label() }}</h4>
    <p class="data-state-message">
      Something went wrong fetching this section. Check your connection and try again.
    </p>
    <button type="button" class="data-state-retry" (click)="retry.emit()">
      <i class="fas fa-rotate-right me-2"></i>Try again
    </button>
  </div>
} @else {
  <div class="data-state" role="status" aria-live="polite">
    <div class="spinner-border text-primary" role="presentation">
      <span class="visually-hidden">Loading…</span>
    </div>
    <p class="data-state-message">Loading {{ label() }}…</p>
  </div>
}
