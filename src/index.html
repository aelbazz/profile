<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#667eea">
  <meta name="format-detection" content="telephone=no">

  <!--
    Primary meta / SEO (static). This is the fallback link-preview bots (Slack, Twitter,
    LinkedIn) actually see, since they read this file directly and never run Angular - see
    SeoService and docs/ANGULAR-INTEGRATION.md. It describes the Portfolio platform itself;
    each route (marketing page or tenant profile) overrides title/description at runtime via
    SeoService for the browser tab and for crawlers that do execute JS.
  -->
  <title>Portfolio — Professional Portfolio Platform</title>
  <meta name="description" content="Portfolio gives professionals and businesses a polished, easy-to-manage online profile - without building or maintaining a website from scratch.">
  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">
  <link rel="canonical" href="https://aelbazz.github.io/profile/">

  <!-- Open Graph / Facebook (static) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aelbazz.github.io/profile/">
  <meta property="og:title" content="Portfolio — Professional Portfolio Platform">
  <meta property="og:description" content="Portfolio gives professionals and businesses a polished, easy-to-manage online profile - without building or maintaining a website from scratch.">
  <meta property="og:site_name" content="Portfolio">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card (static) -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:url" content="https://aelbazz.github.io/profile/">
  <meta name="twitter:title" content="Portfolio — Professional Portfolio Platform">
  <meta name="twitter:description" content="Portfolio gives professionals and businesses a polished, easy-to-manage online profile - without building or maintaining a website from scratch.">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <script>
    // Handle redirect from 404.html for GitHub Pages SPA routing
    (function() {
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect);
      }
      
      // Handle query parameter redirect (from 404.html)
      var match = /[?&]\/?(.*)/.exec(location.search);
      if (match && match[1]) {
        var route = match[1].replace(/\//g, '/');
        history.replaceState(null, null, '/' + route);
      }
    })();
  </script>
  <script>
    // Portal-only bootstrap guess (see ThemeService) - paints the last-known Control Portal
    // theme before Angular loads, avoiding a flash on a hard refresh of any /client/** or
    // /admin/** route. Harmless everywhere else: the public tenant site always applies its
    // own server-confirmed themeMode before anything paints (the profile resolver blocks
    // route activation until that data is ready), and the marketing site has no theme
    // switching, so 'light' is simply always correct there too. Overwritten the instant a
    // real preference loads - see ThemeService.applyTheme().
    (function () {
      var mode = 'light';
      try {
        if (localStorage.getItem('portal.themeMode') === 'dark') mode = 'dark';
      } catch (e) {
        // Storage unavailable - default light renders instead.
      }
      document.documentElement.setAttribute('data-theme', mode);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
